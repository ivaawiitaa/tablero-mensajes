<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <title>Tablero de mensajes</title>
</head>
<body>
    <h1>Tablero de mensajes</h1>
    <p>Total de mensajes: {{ object_list|length }}</p>

    <ul>
        {% for mensaje in object_list %}
            <li>
                <strong>{{ mensaje.autor }}</strong>
                ({{ mensaje.fecha|date:"j \d\e F, H:i" }}):
                {{ mensaje.texto }}
            </li>
        {% empty %}
            <li>Todavía no hay mensajes.</li>
        {% endfor %}
    </ul>
</body>
</html>
